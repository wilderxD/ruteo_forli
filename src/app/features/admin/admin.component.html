<div class="bg-white rounded-lg shadow-sm border border-[#E0E0E0] p-4 mb-4">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <h3 class="font-bold text-slate-800 f-display tracking-wide"><i class="fas fa-chart-line mr-2 text-[#D32F2F]"></i>Panel de Control</h3>
      <div class="flex items-center gap-3">
        <span [class]="esManana ? 'text-sm font-medium text-slate-400' : 'text-sm font-medium text-[#D32F2F]'">HOY</span>
        <label class="switch">
          <input type="checkbox" [(ngModel)]="esManana">
          <span class="slider"></span>
        </label>
        <span [class]="esManana ? 'text-sm font-medium text-[#D32F2F]' : 'text-sm font-medium text-slate-400'">PRÓX. ENTREGA</span>
      </div>
    </div>
    <div *ngIf="esManana" class="flex items-center gap-2 bg-[#FFF8F7] rounded-lg px-3 py-1.5 border border-[#E0E0E0]">
      <i class="fas fa-calendar-alt text-[#5B403D] text-sm"></i>
      <input type="date" [(ngModel)]="fechaGlobal" (change)="cambiarFecha()" class="bg-transparent text-sm text-slate-700 focus:outline-none">
    </div>
    <div class="flex flex-wrap gap-2">
      <button (click)="asignarChoferes()" class="px-3 py-1.5 text-sm font-semibold text-[#D32F2F] hover:bg-[#D32F2F]/10 rounded-lg transition border border-[#D32F2F]/40 bg-white btn-ghost">
        <i class="fas fa-users-gear mr-1"></i> Asignar Choferes
      </button>
      <button (click)="moverRutas()" class="px-3 py-1.5 text-sm font-semibold text-[#F57C00] hover:bg-[#F57C00]/10 rounded-lg transition border border-[#F57C00]/40 bg-white btn-ghost">
        <i class="fas fa-box-open mr-1"></i> A Hoy
      </button>
      <button (click)="descargarExcel()" class="px-3 py-1.5 text-sm font-semibold text-[#D32F2F] hover:bg-[#D32F2F]/10 rounded-lg transition border border-[#D32F2F]/40 bg-white btn-ghost">
        <i class="fas fa-file-excel mr-1"></i> XLS
      </button>
    </div>
  </div>
</div>

<div class="flex justify-between items-center mb-4">
  <button (click)="cargarAdmin()" class="text-sm text-[#5B403D] hover:text-[#D32F2F] transition font-medium btn-ghost">
    <i class="fas fa-sync-alt mr-1"></i> Refrescar Panel
  </button>
  <span class="inline-flex items-center gap-2 px-3 py-1.5 bg-[#121212] rounded-full text-sm text-white font-medium">
    <i class="fas fa-truck text-[#D32F2F]"></i> <span>{{ estados.length }} {{ estados.length === 1 ? 'Unidad' : 'Unidades' }}</span>
  </span>
</div>

<div *ngIf="estados.length === 0" class="text-center py-12">
  <div class="bg-[#FFFFFF] rounded-lg p-8 text-[#5B403D] border border-dashed border-[#E0E0E0] inline-block">
    <i class="fas fa-inbox text-4xl mb-3 block"></i>No hay rutas para este día.
  </div>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
  <div *ngFor="let item of estados" (click)="verRuta(item[0])" class="bg-white rounded-lg border border-[#E0E0E0] overflow-hidden hover:shadow-md transition-all cursor-pointer card-hover">
    <div class="bg-[#121212] px-4 py-3 border-b border-[#263238]">
      <div class="flex justify-between items-center">
        <span class="plate text-base">{{ item[0] }}</span>
        <span class="text-xs font-medium px-2 py-1 rounded-full f-data" [style.background]="colorPct(item[1]) + '20'" [style.color]="colorPct(item[1])">{{ porcentaje(item[1]) | number: '1.0-0' }}%</span>
      </div>
    </div>
    <div class="p-4">
      <div class="mb-2">
        <span *ngFor="let z of item[1].zonas" class="inline-block px-2 py-0.5 bg-[#FFF8F7] text-[#5B403D] rounded-sm text-xs mr-1 mb-1">{{ z }}</span>
      </div>
      <p class="text-sm text-slate-600 mb-3"><i class="fas fa-user mr-2 text-[#5B403D]"></i> {{ item[1].chofer || 'Sin asignar' }}</p>
      <div class="w-full bg-[#E8ECEB] rounded-full h-2 overflow-hidden">
        <div class="h-full rounded-full transition-all duration-500" [style.width]="porcentaje(item[1]) + '%'" [style.background]="colorPct(item[1])"></div>
      </div>
    </div>
  </div>
</div>
